log_format api_safe escape=json '{"request_id":"$request_id","method":"$request_method","status":$status,"upstream_status":"$upstream_status","duration_seconds":$request_time}';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        # Legacy GET queries may contain prompts; stream paths contain tickets.
        # Status-only logs retain proxy diagnostics without recording those URLs.
        access_log /dev/stdout api_safe;
        error_log /dev/null;
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        # SSE tokens must reach the browser immediately.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
